name: Fix Plaid Constant

on:
  push:
    branches:
      - feature/tim-95-calendar-redesign
    paths:
      - .github/workflows/fix-plaid-constant.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tim-95-calendar-redesign
      - run: python3 scripts/fix_plaid_accessible_constant.py
      - run: grep -q 'kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly' 'Budgeting App/PlaidAPIClient.swift'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/PlaidAPIClient.swift'
          git commit -m 'fix: restore Plaid keychain accessibility constant'
          git push origin HEAD:feature/tim-95-calendar-redesign
