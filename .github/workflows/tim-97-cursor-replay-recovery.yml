name: TIM-97 cursor replay recovery

on:
  push:
    branches:
      - timothyhwo2000/tim-97-make-plaid-institution-sync-resilient-to-unsupported-product
    paths:
      - .github/workflows/tim-97-cursor-replay-recovery.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-97-make-plaid-institution-sync-resilient-to-unsupported-product

      - name: Defer cursor commits and recover discarded transaction history
        shell: python
        run: |
          from pathlib import Path

          edge_path = Path("supabase/functions/plaid/index.ts")
          edge = edge_path.read_text()

          old_sync_item = '''    const accessToken = await decryptToken(item.access_token_cipher);
            const institutionName = await refreshInstitutionName(item, accessToken);
            const [accounts, transactions, creditLiabilities, investments] = await Promise.all([
              fetchAccounts(item, accessToken, institutionName),
              syncTransactions(item, accessToken),
              fetchLiabilities(item, accessToken),
              fetchInvestments(item, accessToken)
            ]);
            await logSync(item.item_id, "sync", "Plaid sync completed");
            return {
              accounts,
              transactions,
              creditLiabilities,
              holdings: investments.holdings,
              investmentTransactions: investments.transactions
            };'''
          new_sync_item = '''    const accessToken = await decryptToken(item.access_token_cipher);
            const institutionName = await refreshInstitutionName(item, accessToken);
            const replayTransactions = await shouldReplayTransactionsAfterDiscardedSync(item.item_id);
            const [accounts, transactionResult, creditLiabilities, investments] = await Promise.all([
              fetchAccounts(item, accessToken, institutionName),
              syncTransactions(item, accessToken, replayTransactions),
              fetchLiabilities(item, accessToken),
              fetchInvestments(item, accessToken)
            ]);
            if (transactionResult.nextCursor) {
              await updateCursor(item.item_id, transactionResult.nextCursor);
              if (replayTransactions) {
                await logSync(
                  item.item_id,
                  "cursor-replay-complete",
                  "Replayed transaction history after a previously discarded Plaid sync"
                );
              }
            }
            await logSync(item.item_id, "sync", "Plaid sync completed");
            return {
              accounts,
              transactions: transactionResult.transactions,
              creditLiabilities,
              holdings: investments.holdings,
              investmentTransactions: investments.transactions
            };'''
          if edge.count(old_sync_item) != 1:
              raise SystemExit(f"Expected one edge syncItem match, found {edge.count(old_sync_item)}")
          edge = edge.replace(old_sync_item, new_sync_item)

          old_transactions = '''async function syncTransactions(item: PlaidItem, accessToken: string): Promise<JsonRecord[]> {
            try {
              let cursor = item.transaction_cursor || undefined;
              let hasMore = true;
              const transactions: JsonRecord[] = [];
          
              while (hasMore) {
                const data = await plaidFetch("/transactions/sync", {
                  access_token: accessToken,
                  cursor,
                  count: 500
                });
          
                transactions.push(...arrayValue(data.added).map((tx) => normalizeTransaction(tx, item.item_id)));
                transactions.push(...arrayValue(data.modified).map((tx) => normalizeTransaction(tx, item.item_id)));
                transactions.push(...arrayValue(data.removed).map((tx) => normalizeRemovedTransaction(tx, item.item_id)));
                cursor = stringValue(data.next_cursor) || undefined;
                hasMore = Boolean(data.has_more);
              }
          
              if (cursor) await updateCursor(item.item_id, cursor);
              return transactions;
            } catch (error) {
              if (isProductUnavailable(error, "transactions")) {
                const message = error instanceof Error ? error.message : "Transactions unavailable";
                await logSync(item.item_id, "transactions-unavailable", message);
                return [];
              }
              throw error;
            }
          }'''
          new_transactions = '''async function syncTransactions(
            item: PlaidItem,
            accessToken: string,
            replayFromStart = false
          ): Promise<{ transactions: JsonRecord[]; nextCursor: string | null }> {
            try {
              let cursor = replayFromStart ? undefined : item.transaction_cursor || undefined;
              let hasMore = true;
              const transactions: JsonRecord[] = [];
          
              while (hasMore) {
                const data = await plaidFetch("/transactions/sync", {
                  access_token: accessToken,
                  cursor,
                  count: 500
                });
          
                transactions.push(...arrayValue(data.added).map((tx) => normalizeTransaction(tx, item.item_id)));
                transactions.push(...arrayValue(data.modified).map((tx) => normalizeTransaction(tx, item.item_id)));
                transactions.push(...arrayValue(data.removed).map((tx) => normalizeRemovedTransaction(tx, item.item_id)));
                cursor = stringValue(data.next_cursor) || undefined;
                hasMore = Boolean(data.has_more);
              }
          
              return { transactions, nextCursor: cursor || null };
            } catch (error) {
              if (isProductUnavailable(error, "transactions")) {
                const message = error instanceof Error ? error.message : "Transactions unavailable";
                await logSync(item.item_id, "transactions-unavailable", message);
                return { transactions: [], nextCursor: null };
              }
              throw error;
            }
          }'''
          if edge.count(old_transactions) != 1:
              raise SystemExit(f"Expected one edge syncTransactions match, found {edge.count(old_transactions)}")
          edge = edge.replace(old_transactions, new_transactions)

          helper_anchor = '''async function updateCursor(itemId: string, cursor: string): Promise<void> {'''
          helper = '''async function shouldReplayTransactionsAfterDiscardedSync(itemId: string): Promise<boolean> {
            const { data, error } = await supabase()
              .from("plaid_sync_logs")
              .select("event_type,message,created_at")
              .eq("item_id", itemId)
              .order("created_at", { ascending: false })
              .limit(50);
            if (error) throw error;
          
            for (const row of data || []) {
              if (row.event_type === "cursor-replay-complete") return false;
              if (
                row.event_type === "error" &&
                String(row.message || "").toLowerCase().includes("products are not supported")
              ) {
                return true;
              }
            }
            return false;
          }
          
          async function updateCursor(itemId: string, cursor: string): Promise<void> {'''
          if edge.count(helper_anchor) != 1:
              raise SystemExit(f"Expected one updateCursor anchor, found {edge.count(helper_anchor)}")
          edge = edge.replace(helper_anchor, helper)
          edge_path.write_text(edge)

          node_path = Path("plaid-backend/api/plaid/sync.js")
          node = node_path.read_text()

          old_node_item = '''    const [accounts, transactionResult, creditLiabilities, investments] = await Promise.all([
              fetchAccounts(client, item, accessToken, institutionName),
              syncTransactions(client, item, accessToken),
              fetchLiabilities(client, item, accessToken),
              fetchInvestments(client, item, accessToken)
            ]);
            await logSync(item.item_id, "sync", "Plaid sync completed");'''
          new_node_item = '''    const [accounts, transactionResult, creditLiabilities, investments] = await Promise.all([
              fetchAccounts(client, item, accessToken, institutionName),
              syncTransactions(client, item, accessToken),
              fetchLiabilities(client, item, accessToken),
              fetchInvestments(client, item, accessToken)
            ]);
            if (transactionResult.nextCursor) {
              await updateCursor(item.item_id, transactionResult.nextCursor);
            }
            await logSync(item.item_id, "sync", "Plaid sync completed");'''
          if node.count(old_node_item) != 1:
              raise SystemExit(f"Expected one node syncItem match, found {node.count(old_node_item)}")
          node = node.replace(old_node_item, new_node_item)

          old_node_transactions = '''    if (cursor) {
              await updateCursor(item.item_id, cursor);
            }
            return { transactions };
          } catch (error) {
            if (isProductUnavailable(error)) {
              await logSync(item.item_id, "transactions-unavailable", error.message);
              return { transactions: [] };
            }'''
          new_node_transactions = '''    return { transactions, nextCursor: cursor || null };
          } catch (error) {
            if (isProductUnavailable(error)) {
              await logSync(item.item_id, "transactions-unavailable", error.message);
              return { transactions: [], nextCursor: null };
            }'''
          if node.count(old_node_transactions) != 1:
              raise SystemExit(f"Expected one node cursor block match, found {node.count(old_node_transactions)}")
          node_path.write_text(node.replace(old_node_transactions, new_node_transactions))

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate backend changes
        shell: bash
        run: |
          deno check --no-lock --config supabase/functions/plaid/deno.json supabase/functions/plaid/index.ts
          node --check plaid-backend/api/plaid/link-token.js
          node --check plaid-backend/api/plaid/sync.js

      - name: Commit validated changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tim-97-cursor-replay-recovery.yml
          rm -f supabase/functions/plaid/deno.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-97 recover discarded Plaid transaction history safely"
          git push origin HEAD:timothyhwo2000/tim-97-make-plaid-institution-sync-resilient-to-unsupported-product
