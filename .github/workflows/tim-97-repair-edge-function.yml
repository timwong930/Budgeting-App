name: TIM-97 repair and validate Plaid edge function

on:
  push:
    branches:
      - timothyhwo2000/tim-97-make-plaid-institution-sync-resilient-to-unsupported-product
    paths:
      - .github/workflows/tim-97-repair-edge-function.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-97-make-plaid-institution-sync-resilient-to-unsupported-product
          fetch-depth: 0

      - name: Restore canonical file then apply TIM-97 safely
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          subprocess.run(["git", "checkout", "origin/main", "--", "supabase/functions/plaid/index.ts"], check=True)
          path = Path("supabase/functions/plaid/index.ts")
          text = path.read_text()

          # Preserve the currently deployed AASA custom-domain behavior.
          old_route = '''    const path = routePath(req.url);
              if (path === "/plaid/oauth" && req.method === "GET") return oauthPage(req.url);
              if (path === "/.well-known/apple-app-site-association" && req.method === "GET") {
                return jsonResponse(appleAppSiteAssociation());
              }'''
          new_route = '''    const path = routePath(req.url);
              const rawPath = new URL(req.url).pathname;

              // Supabase Edge Functions are normally reached under /functions/v1/<name>/,
              // but keep AASA compatible with custom-domain/reverse-proxy rewrites too.
              if ((path === "/.well-known/apple-app-site-association" || rawPath === "/.well-known/apple-app-site-association") && req.method === "GET") {
                return jsonResponse(appleAppSiteAssociation());
              }

              if (path === "/plaid/oauth" && req.method === "GET") return oauthPage(req.url);'''
          if text.count(old_route) != 1:
              raise SystemExit(f"Expected one route block, found {text.count(old_route)}")
          text = text.replace(old_route, new_route)

          # Preserve deployed update-mode support while keeping product scoping.
          link_start = text.index("async function createLinkToken(requestBody: JsonRecord): Promise<Response> {")
          link_end = text.index("\nfunction linkProductConfig", link_start)
          new_link = '''async function createLinkToken(requestBody: JsonRecord): Promise<Response> {
            const productScope = stringValue(requestBody.productScope) || "banking";
            const updateItemId = stringValue(requestBody.updateItemId);
            const productConfig = linkProductConfig(productScope);

            const linkTokenRequest: JsonRecord = {
              user: { client_user_id: "momos-money-personal-user" },
              client_name: "Momo's Money!",
              products: productConfig.products,
              required_if_supported_products: productConfig.requiredIfSupportedProducts,
              country_codes: envList("PLAID_COUNTRY_CODES", "US"),
              language: "en",
              redirect_uri: requiredEnv("PLAID_REDIRECT_URI"),
              webhook: Deno.env.get("PLAID_WEBHOOK_URL") || undefined,
              transactions: { days_requested: 730 }
            };

            if (updateItemId) {
              linkTokenRequest.update = { item_id: updateItemId };
            }

            const response = await plaidFetch("/link/token/create", linkTokenRequest);
            return jsonResponse({
              linkToken: response.link_token,
              expiration: response.expiration
            });
          }
          '''
          text = text[:link_start] + new_link.rstrip() + text[link_end:]

          # Transactions can be unavailable independently; don't discard valid accounts.
          tx_start = text.index("async function syncTransactions(item: PlaidItem, accessToken: string): Promise<JsonRecord[]> {")
          tx_end = text.index("\nasync function fetchLiabilities", tx_start)
          new_tx = '''async function syncTransactions(item: PlaidItem, accessToken: string): Promise<JsonRecord[]> {
            try {
              let cursor = item.transaction_cursor || undefined;
              let hasMore = true;
              const transactions: JsonRecord[] = [];

              while (hasMore) {
                const data = await plaidFetch("/transactions/sync", {
                  access_token: accessToken,
                  cursor,
                  count: 500
                });

                transactions.push(...arrayValue(data.added).map((tx) => normalizeTransaction(tx, item.item_id)));
                transactions.push(...arrayValue(data.modified).map((tx) => normalizeTransaction(tx, item.item_id)));
                transactions.push(...arrayValue(data.removed).map((tx) => normalizeRemovedTransaction(tx, item.item_id)));
                cursor = stringValue(data.next_cursor) || undefined;
                hasMore = Boolean(data.has_more);
              }

              if (cursor) await updateCursor(item.item_id, cursor);
              return transactions;
            } catch (error) {
              if (isProductUnavailable(error, "transactions")) {
                const message = error instanceof Error ? error.message : "Transactions unavailable";
                await logSync(item.item_id, "transactions-unavailable", message);
                return [];
              }
              throw error;
            }
          }
          '''
          text = text[:tx_start] + new_tx.rstrip() + text[tx_end:]

          # Preserve deployed login-required health semantics.
          old_catch = '''  } catch (error) {
              const message = error instanceof Error ? error.message : "Plaid sync failed";
              await markItemError(item.item_id, message);
              await logSync(item.item_id, "error", message);
              return empty;
            }
          }'''
          new_catch = '''  } catch (error) {
              const message = error instanceof Error ? error.message : "Plaid sync failed";
              const isLoginRequired = error instanceof PlaidApiError && error.errorCode === "ITEM_LOGIN_REQUIRED";
              await markItemError(item.item_id, message, isLoginRequired ? "needs_update" : "error");
              await logSync(item.item_id, "error", message);
              return empty;
            }
          }'''
          if text.count(old_catch) != 1:
              raise SystemExit(f"Expected one sync catch, found {text.count(old_catch)}")
          text = text.replace(old_catch, new_catch)

          old_mark = '''async function markItemError(itemId: string, message: string): Promise<void> {
            const { error } = await supabase()
              .from("plaid_items")
              .update({ health: "error", error_message: message, updated_at: new Date().toISOString() })
              .eq("item_id", itemId);
            if (error) throw error;
          }'''
          new_mark = '''async function markItemError(itemId: string, message: string, health = "error"): Promise<void> {
            const { error } = await supabase()
              .from("plaid_items")
              .update({ health, error_message: message, updated_at: new Date().toISOString() })
              .eq("item_id", itemId);
            if (error) throw error;
          }'''
          if text.count(old_mark) != 1:
              raise SystemExit(f"Expected one markItemError, found {text.count(old_mark)}")
          text = text.replace(old_mark, new_mark)

          helper_start = text.index("function isProductUnavailable(error: unknown, productName: string): boolean {")
          helper_end = text.index("\nfunction encode", helper_start)
          new_helper = '''function isProductUnavailable(error: unknown, productName: string): boolean {
            if (!(error instanceof PlaidApiError)) return false;
            if ([
              "PRODUCT_NOT_READY",
              "PRODUCT_NOT_ENABLED",
              "PRODUCTS_NOT_SUPPORTED",
              "NO_INVESTMENT_ACCOUNTS",
              "NO_LIABILITY_ACCOUNTS",
              "ACCESS_NOT_GRANTED"
            ].includes(error.errorCode || "")) {
              return true;
            }
            const message = error.message.toLowerCase();
            const normalizedProduct = productName.toLowerCase().replace("product_", "");
            return message.includes("does not have user consent") && message.includes(normalizedProduct);
          }
          '''
          text = text[:helper_start] + new_helper.rstrip() + text[helper_end:]

          if "pendingTransactionId: stringValue(transaction.pending_transaction_id)" not in text:
              raise SystemExit("TIM-82 pending linkage was lost")
          if "pathnasync" in text:
              raise SystemExit("Malformed route/link boundary detected")
          path.write_text(text)

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check edge function
        run: deno check --config supabase/functions/plaid/deno.json supabase/functions/plaid/index.ts

      - name: Check Vercel legacy backend syntax
        run: |
          node --check plaid-backend/api/plaid/link-token.js
          node --check plaid-backend/api/plaid/sync.js

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tim-97-repair-edge-function.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-97 repair and validate Plaid product isolation"
          git push origin HEAD:timothyhwo2000/tim-97-make-plaid-institution-sync-resilient-to-unsupported-product
