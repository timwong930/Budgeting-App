name: TIM-95 Split Body Typecheck Fix

on:
  push:
    branches:
      - feature/tim-95-calendar-redesign
    paths:
      - .github/workflows/tim95-split-body-typecheck.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tim-95-calendar-redesign
          fetch-depth: 0
      - name: Apply body split fix
        run: python3 scripts/tim95_split_body_typecheck.py
      - name: Validate view stages
        run: |
          grep -q 'private var tabChromeContent: some View' 'Budgeting App/ContentView.swift'
          grep -q 'private var lifecycleTabContent: some View' 'Budgeting App/ContentView.swift'
          grep -q 'private var observedTabContent: some View' 'Budgeting App/ContentView.swift'
          grep -q 'private var presentedContent: some View' 'Budgeting App/ContentView.swift'
          grep -q '^        presentedContent$' 'Budgeting App/ContentView.swift'
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/ContentView.swift'
          git commit -m 'TIM-95: split ContentView body for compiler'
          git push origin HEAD:feature/tim-95-calendar-redesign
