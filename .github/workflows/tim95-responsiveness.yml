name: TIM-95 Responsiveness Patch

on:
  push:
    branches:
      - feature/tim-95-calendar-redesign
    paths:
      - .github/workflows/tim95-responsiveness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tim-95-calendar-redesign
      - name: Apply responsiveness patch
        run: python3 scripts/tim95_responsiveness_patch.py
      - name: Validate markers
        run: |
          grep -q 'calendarCacheRefreshTask' 'Budgeting App/ContentView.swift'
          grep -q 'private var calendarCacheDates' 'Budgeting App/ContentView.swift'
          grep -q 'Task.sleep(nanoseconds: 150_000_000)' 'Budgeting App/ContentView.swift'
          ! grep -q 'calendarWeeks.flatMap' 'Budgeting App/ContentView.swift'
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/ContentView.swift'
          git diff --cached --quiet || git commit -m 'TIM-95: prevent calendar cache from blocking UI'
          git push origin HEAD:feature/tim-95-calendar-redesign
