name: TIM-96 account ledger navigation patch

on:
  push:
    branches:
      - timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
    paths:
      - .github/workflows/tim-96-contentview-patch.yml

permissions:
  contents: write

jobs:
  patch-content-view:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
      - name: Route account rows to transaction ledgers
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("Budgeting App/ContentView.swift")
          text = path.read_text()

          replacements = [
              (
                  r"NavigationLink\s*\{\s*EditBankAccountView\(account:\s*\$account\)\s*\}\s*label:\s*\{",
                  "NavigationLink {\n                                BankAccountLedgerView(account: $account, budget: budget)\n                            } label: {",
              ),
              (
                  r"NavigationLink\s*\{\s*EditCreditAccountView\(account:\s*\$account\)\s*\}\s*label:\s*\{",
                  "NavigationLink {\n                                CreditAccountLedgerView(account: $account, budget: budget)\n                            } label: {",
              ),
          ]

          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Expected exactly one navigation destination match, found {count}")

          path.write_text(text)
      - name: Commit guarded patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tim-96-contentview-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-96 route bank and credit accounts to ledgers"
          git push origin HEAD:timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
