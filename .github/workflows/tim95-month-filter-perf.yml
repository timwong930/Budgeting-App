name: TIM-95 Month Filter Performance Patch

on:
  push:
    branches:
      - feature/tim-95-calendar-redesign
    paths:
      - .github/workflows/tim95-month-filter-perf.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tim-95-calendar-redesign
          fetch-depth: 0
      - name: Apply filter/performance patch
        run: python3 scripts/tim95_month_filter_perf_patch.py
      - name: Validate markers
        run: |
          grep -q 'guard calendarShowExpenses else { return 0 }' 'Budgeting App/ContentView.swift'
          grep -q 'guard calendarShowCreditDue else { return 0 }' 'Budgeting App/ContentView.swift'
          grep -q 'if calendarShowPortfolio {' 'Budgeting App/ContentView.swift'
          grep -q '.onChange(of: calendarShowPortfolio)' 'Budgeting App/ContentView.swift'
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/ContentView.swift'
          git commit -m 'TIM-95: keep hidden portfolio work out of month calendar'
          git push origin HEAD:feature/tim-95-calendar-redesign
