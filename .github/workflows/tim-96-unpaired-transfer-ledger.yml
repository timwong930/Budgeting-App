name: TIM-96 external transfer ledger validation

on:
  push:
    branches:
      - timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
    paths:
      - .github/workflows/tim-96-unpaired-transfer-ledger.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit

      - name: Apply guarded patch
        run: python3 .github/scripts/tim96_unpaired_transfer_patch.py

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project "Budgeting App.xcodeproj" \
            -scheme "Budgeting App" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit validated product changes
        run: |
          rm -f .github/workflows/tim-96-unpaired-transfer-ledger.yml
          rm -f .github/scripts/tim96_unpaired_transfer_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-96 keep external Plaid transfers visible in account ledgers"
          git push origin HEAD:timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
