name: TIM-95 Budget Quick Actions

on:
  push:
    branches:
      - feature/tim-95-calendar-redesign
    paths:
      - .github/workflows/tim95-budget-quick-actions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tim-95-calendar-redesign
          fetch-depth: 0
      - name: Apply budget quick actions
        run: python3 scripts/tim95_budget_quick_actions.py
      - name: Validate patch
        run: |
          grep -q 'budgetQuickActionsSection' 'Budgeting App/ContentView.swift'
          grep -q 'budgetQuickAction(title: "Expense"' 'Budgeting App/ContentView.swift'
          grep -q 'budgetQuickAction(title: "Income"' 'Budgeting App/ContentView.swift'
          grep -q 'budgetQuickAction(title: "Savings"' 'Budgeting App/ContentView.swift'
          grep -q 'budgetQuickAction(title: "Transfer"' 'Budgeting App/ContentView.swift'
      - name: Commit app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/ContentView.swift'
          git commit -m 'TIM-95: add Budget quick actions'
          git push origin HEAD:feature/tim-95-calendar-redesign

# retry: robust budget snapshot anchor
