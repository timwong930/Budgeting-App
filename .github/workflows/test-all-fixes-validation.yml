name: Consolidated all-fixes validation

on:
  push:
    branches:
      - test-all-fixes
    paths:
      - .github/workflows/test-all-fixes-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-all-fixes

      - name: Apply TIM-113 account rename preservation
        run: python3 .github/scripts/test_all_fixes_patch.py

      - name: Verify consolidated feature anchors
        shell: bash
        run: |
          grep -q 'let displayName = localDisplayName(for: account) ?? account.name' 'Budgeting App/PlaidSyncEngine.swift'
          grep -q 'BankCashCategoriesSection' 'Budgeting App/AccountTransactionLedger.swift'
          grep -q 'bankCashCategories.v1' 'Budgeting App/BankCashCategories.swift'
          grep -q 'merchantCategoryPreferences' 'Budgeting App/Models.swift' || grep -q 'rememberPlaidCategory' 'Budgeting App/Models.swift' || true

      - name: Build consolidated app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "Budgeting App.xcodeproj" \
            -scheme "Budgeting App" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit validated test branch and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/test-all-fixes-validation.yml
          rm -f .github/scripts/test_all_fixes_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Test branch: consolidate TIM-96 TIM-97 TIM-98 TIM-112 TIM-113"
          git push origin HEAD:test-all-fixes
