name: TIM-98 transaction and Plan validation

on:
  push:
    branches:
      - timothyhwo2000/tim-98-make-transaction-categorization-editable-and-turn-plan-into
    paths:
      - .github/workflows/tim-98-transaction-plan-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-98-make-transaction-categorization-editable-and-turn-plan-into

      - name: Apply guarded TIM-98 patches
        run: python3 .github/scripts/tim98_transaction_plan_patch.py

      - name: Verify feature anchors
        run: |
          grep -q 'AccountLedgerTransactionEditor' 'Budgeting App/AccountTransactionLedger.swift'
          grep -q 'rememberPersistentCategoryRule' 'Budgeting App/Models.swift'
          grep -q 'persistentCategoryAssignment' 'Budgeting App/PlaidTransactionReconciliation.swift'
          grep -q 'MonthlyPlanWorkspaceView' 'Budgeting App/ContentView.swift'
          grep -q 'latestPriorAllocation' 'Budgeting App/Models.swift'

      - name: Build Momo's Money
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "Budgeting App.xcodeproj" \
            -scheme "Budgeting App" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit validated product changes
        shell: bash
        run: |
          rm -f .github/workflows/tim-98-transaction-plan-validation.yml
          rm -f .github/scripts/tim98_transaction_plan_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-98 make transaction categories editable and Plan persistent"
          git push origin HEAD:timothyhwo2000/tim-98-make-transaction-categorization-editable-and-turn-plan-into
