name: TIM-96 account navigation UX follow-up

on:
  push:
    branches:
      - timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
    paths:
      - .github/workflows/tim-96-account-ux-followup.yml

permissions:
  contents: write

jobs:
  patch-account-ux:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit

      - name: Make account navigation obvious and enlarge managers
        shell: python
        run: |
          from pathlib import Path

          path = Path("Budgeting App/ContentView.swift")
          text = path.read_text()

          replacements = [
              (
                  '''            Menu("Manage") {
                              Button("Transfer Cash") {
                                  showingAddCashTransfer = true
                              }
                              Button("Banks") {
                                  showingBankAccounts = true
                              }
                              Button("Cards") {
                                  showingCreditAccounts = true
                              }
                          }
                          .buttonStyle(.bordered)
                          .controlSize(.small)''',
                  '''            Button {
                              showingAddCashTransfer = true
                          } label: {
                              Label("Transfer", systemImage: "arrow.left.arrow.right")
                          }
                          .buttonStyle(.bordered)
                          .controlSize(.small)'''
              ),
              (
                  '''            if !budget.bankAccounts.isEmpty {
                          GlassCard {
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("Bank Accounts")
                                      .font(.headline)
                                  ForEach(budget.bankAccounts) { account in
                                      HStack {
                                          Text(account.name)
                                          Spacer()
                                          Text(account.balance, format: .currency(code: "USD"))
                                      }
                                      .font(.subheadline)
                                  }
                              }
                          }
                      }''',
                  '''            if !budget.bankAccounts.isEmpty {
                          Button {
                              showingBankAccounts = true
                          } label: {
                              GlassCard {
                                  VStack(alignment: .leading, spacing: 10) {
                                      HStack {
                                          VStack(alignment: .leading, spacing: 2) {
                                              Text("Bank Accounts")
                                                  .font(.headline)
                                              Text("View transactions & manage accounts")
                                                  .font(.caption)
                                                  .foregroundStyle(.secondary)
                                          }
                                          Spacer()
                                          Image(systemName: "chevron.right")
                                              .font(.subheadline.weight(.semibold))
                                              .foregroundStyle(.secondary)
                                      }
                                      ForEach(budget.bankAccounts) { account in
                                          HStack {
                                              Text(account.name)
                                              Spacer()
                                              Text(account.balance, format: .currency(code: "USD"))
                                          }
                                          .font(.subheadline)
                                      }
                                  }
                              }
                          }
                          .buttonStyle(.plain)
                          .accessibilityLabel("Open bank accounts")
                      }'''
              ),
              (
                  '''            if !budget.creditAccounts.isEmpty {
                          GlassCard {
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("Credit Cards")
                                      .font(.headline)
                                  ForEach(budget.creditAccounts.filter(\\.isActive)) { account in
                                      HStack {
                                          Text(account.name)
                                          Spacer()
                                          Text(creditAccountActualBalance(account), format: .currency(code: "USD"))
                                              .foregroundStyle(.red)
                                      }
                                      .font(.subheadline)
                                  }
                              }
                          }
                      }''',
                  '''            if !budget.creditAccounts.isEmpty {
                          Button {
                              showingCreditAccounts = true
                          } label: {
                              GlassCard {
                                  VStack(alignment: .leading, spacing: 10) {
                                      HStack {
                                          VStack(alignment: .leading, spacing: 2) {
                                              Text("Credit Cards")
                                                  .font(.headline)
                                              Text("View transactions & manage cards")
                                                  .font(.caption)
                                                  .foregroundStyle(.secondary)
                                          }
                                          Spacer()
                                          Image(systemName: "chevron.right")
                                              .font(.subheadline.weight(.semibold))
                                              .foregroundStyle(.secondary)
                                      }
                                      ForEach(budget.creditAccounts.filter(\\.isActive)) { account in
                                          HStack {
                                              Text(account.name)
                                              Spacer()
                                              Text(creditAccountActualBalance(account), format: .currency(code: "USD"))
                                                  .foregroundStyle(.red)
                                          }
                                          .font(.subheadline)
                                      }
                                  }
                              }
                          }
                          .buttonStyle(.plain)
                          .accessibilityLabel("Open credit cards")
                      }'''
              ),
              (
                  '''        .sheet(isPresented: $showingCreditAccounts) {
                      CreditAccountsView(budget: budget)
                          .presentationDetents([.medium])
                          .presentationDragIndicator(.visible)
                  }''',
                  '''        .sheet(isPresented: $showingCreditAccounts) {
                      CreditAccountsView(budget: budget)
                          .presentationDetents([.large])
                          .presentationDragIndicator(.visible)
                  }'''
              ),
              (
                  '''        .sheet(isPresented: $showingBankAccounts) {
                      BankAccountsView(budget: budget)
                          .presentationDetents([.medium])
                          .presentationDragIndicator(.visible)
                  }''',
                  '''        .sheet(isPresented: $showingBankAccounts) {
                      BankAccountsView(budget: budget)
                          .presentationDetents([.large])
                          .presentationDragIndicator(.visible)
                  }'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one guarded UI match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          path.write_text(text)

      - name: Commit product change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tim-96-account-ux-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-96 make account managers obvious and full height"
          git push origin HEAD:timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
