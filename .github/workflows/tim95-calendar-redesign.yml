name: TIM-95 Calendar Redesign Patch

on:
  push:
    branches:
      - feature/tim-95-calendar-redesign
    paths:
      - .github/workflows/tim95-calendar-redesign.yml
      - scripts/tim95_calendar_patch.py

permissions:
  contents: write

jobs:
  patch-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tim-95-calendar-redesign

      - name: Apply calendar redesign
        run: python3 scripts/tim95_calendar_patch.py

      - name: Verify patch markers
        shell: bash
        run: |
          grep -q 'case week = "Week"' 'Budgeting App/ContentView.swift'
          grep -q 'calendarShowPortfolio = false' 'Budgeting App/ContentView.swift'
          grep -q 'calendarWeekAgendaSection' 'Budgeting App/ContentView.swift'
          grep -q 'filteredCalendarEvents' 'Budgeting App/ContentView.swift'

      - name: Commit calendar redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Budgeting App/ContentView.swift'
          git commit -m 'feat: redesign calendar views and filters'
          git push origin HEAD:feature/tim-95-calendar-redesign
