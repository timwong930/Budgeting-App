name: Apply TIM-79

on:
  push:
    branches: [tim-79-stable-account-uuids]
    paths: [.github/workflows/tim-79-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tim-79-stable-account-uuids
      - name: Normalize checklist wording for patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TASKS.md')
          text = path.read_text()
          replacements = {
              '- [ ] Replace name-based account relationships with local account UUIDs.': '- [ ] Replace name-based account references with stable local UUIDs.',
              '- [ ] Add backward-compatible references to income, expenses, transfers, portfolio transactions, and holdings.': '- [ ] Add backward-compatible account references to income, expenses, transfers, portfolio transactions, and holdings.',
              '- [ ] Keep display names as presentation data rather than identity.': '- [ ] Keep display names as presentation fields only.',
              '- [ ] Prevent manual ledger operations from mutating Plaid-authoritative balances.': '- [ ] Prevent manual ledger actions from mutating Plaid-authoritative balances.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'missing checklist line: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: python3 Scripts/apply_tim79.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Budgeting App/Models.swift" "Budgeting App/PlaidSyncEngine.swift" "Budgeting AppTests/CuanMarketModelsTests.swift" TASKS.md
          git commit -m "feat: use stable UUID financial account references"
          git push origin HEAD:tim-79-stable-account-uuids
