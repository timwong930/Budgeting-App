name: Apply TIM-79

on:
  push:
    branches: [tim-79-stable-account-uuids]
    paths: [.github/workflows/tim-79-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tim-79-stable-account-uuids
      - run: python3 Scripts/apply_tim79.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Budgeting App/Models.swift" "Budgeting App/PlaidSyncEngine.swift" "Budgeting AppTests/CuanMarketModelsTests.swift" TASKS.md
          git commit -m "feat: use stable UUID financial account references"
          git push origin HEAD:tim-79-stable-account-uuids
