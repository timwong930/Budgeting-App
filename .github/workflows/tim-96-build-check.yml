name: TIM-96 Xcode build check

on:
  push:
    branches:
      - timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
    paths:
      - .github/workflows/tim-96-build-check.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
      - name: Build Momo's Money
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "Budgeting App.xcodeproj" \
            -scheme "Budgeting App" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/tim96-build.log
      - name: Remove temporary build workflow after success
        shell: bash
        run: |
          rm .github/workflows/tim-96-build-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-96 complete build validation"
          git push origin HEAD:timothyhwo2000/tim-96-add-per-account-transaction-ledgers-for-bank-and-credit
