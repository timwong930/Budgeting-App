name: TIM-113 account rename validation
on: push
permissions:
  contents: write
jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/tim113_patch.py
      - name: Verify source
        run: |
          grep -q 'let displayName = localDisplayName(for: account) ?? account.name' 'Budgeting App/PlaidSyncEngine.swift'
          grep -q 'testPlaidSyncPreservesUserRenamedAccountDisplayNames' 'Budgeting AppTests/CuanMarketModelsTests.swift'
      - name: Build
        run: |
          xcodebuild -project "Budgeting App.xcodeproj" -scheme "Budgeting App" -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Commit validated fix
        run: |
          rm -f .github/workflows/tim113-account-name-fix.yml .github/scripts/tim113_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-113 preserve user-renamed Plaid account display names"
          git push
