name: Apply TIM-80 portfolio selector

on:
  push:
    branches:
      - timothyhwo2000/tim-80-complete-multi-account-portfolio-isolation-and-all
    paths:
      - .github/workflows/tim80-patch.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/tim80_patch.py
          python3 /tmp/tim80_patch.py
      - name: Validate source
        shell: bash
        run: |
          grep -n 'private var portfolioAccountSelector' 'Budgeting App/MarginViews.swift'
          grep -n 'Text("All Portfolios").tag(nil as UUID?)' 'Budgeting App/MarginViews.swift'
          grep -n 'holdings(forPortfolioAccountId: selectedPortfolioAccountId)' 'Budgeting App/MarginViews.swift'
          grep -n 'transactions(forPortfolioAccountId: selectedPortfolioAccountId)' 'Budgeting App/MarginViews.swift'
          git diff --check
      - name: Commit source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/MarginViews.swift'
          if ! git diff --cached --quiet; then
            git commit -m 'TIM-80: add portfolio account switcher'
            git push
          fi
      - name: Build app
        run: |
          xcodebuild \
            -project 'Budgeting App.xcodeproj' \
            -scheme 'Budgeting App' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
