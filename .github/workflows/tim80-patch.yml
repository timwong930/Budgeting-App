name: Validate TIM-80 cash cleanup

on:
  push:
    branches:
      - 'timothyhwo2000/tim-80-complete-multi-account-portfolio-isolation-and-all'
    paths:
      - '.github/workflows/tim80-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Patch source and tests
        run: python3 .github/tim80_cash_cleanup_patch.py
      - name: Validate patch
        run: |
          grep -n 'normalizedTicker(ticker) == "CUR:USD"' 'Budgeting App/PlaidSyncEngine.swift'
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/PlaidSyncEngine.swift' 'Budgeting AppTests/CuanMarketModelsTests.swift'
          if ! git diff --cached --quiet; then
            git commit -m 'TIM-80: remove stale Plaid cash tickers'
            git push
          fi
      - name: Build app
        run: |
          xcodebuild \
            -project 'Budgeting App.xcodeproj' \
            -scheme 'Budgeting App' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
