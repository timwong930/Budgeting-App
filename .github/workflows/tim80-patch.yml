name: Apply TIM-80 duplicate helper fix

on:
  push:
    branches:
      - 'timothyhwo2000/tim-80-complete-multi-account-portfolio-isolation-and-all'
    paths:
      - '.github/workflows/tim80-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate portfolio helpers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('Budgeting App/PlaidSyncEngine.swift')
          source = path.read_text()

          source = source.replace(
              '            let portfolioAccountId = resolvePortfolioAccountId(forPlaidExternalAccountId: first.accountId)',
              '            let resolvedPortfolioAccountId = portfolioAccountId(forPlaidExternalAccountId: first.accountId)',
          )
          source = source.replace(
              '                return holding.portfolioAccountId == portfolioAccountId',
              '                return holding.portfolioAccountId == resolvedPortfolioAccountId',
          )
          source = source.replace(
              '                portfolioAccountId: portfolioAccountId,',
              '                portfolioAccountId: resolvedPortfolioAccountId,',
              1,
          )
          source = source.replace(
              '            portfolioAccountId: resolvePortfolioAccountId(forPlaidExternalAccountId: transaction.accountId),',
              '            portfolioAccountId: portfolioAccountId(forPlaidExternalAccountId: transaction.accountId),',
          )

          pattern = re.compile(
              r'\n    func resolvePortfolioAccountId\(forPlaidExternalAccountId externalAccountId: String\) -> UUID\? \{.*?\n\}\n\nfunc portfolioAccountName\(for id: UUID\?\) -> String \{.*?\n\}\n\nfunc synchronizeAggregatePortfolioBalances\(\) \{.*?\n\}\n',
              re.S,
          )
          source, count = pattern.subn('\n', source, count=1)
          if count != 1:
              raise SystemExit(f'Expected one duplicate helper block, removed {count}')

          path.write_text(source)
          PY
      - name: Validate source cleanup
        shell: bash
        run: |
          ! grep -q 'func resolvePortfolioAccountId' 'Budgeting App/PlaidSyncEngine.swift'
          ! grep -q '^func portfolioAccountName' 'Budgeting App/PlaidSyncEngine.swift'
          ! grep -q '^func synchronizeAggregatePortfolioBalances' 'Budgeting App/PlaidSyncEngine.swift'
          grep -n 'resolvedPortfolioAccountId = portfolioAccountId' 'Budgeting App/PlaidSyncEngine.swift'
          grep -n 'portfolioAccountId: portfolioAccountId(forPlaidExternalAccountId:' 'Budgeting App/PlaidSyncEngine.swift'
          git diff --check
      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/PlaidSyncEngine.swift'
          if ! git diff --cached --quiet; then
            git commit -m 'TIM-80: remove duplicate portfolio helpers'
            git push
          fi
      - name: Xcode version
        run: xcodebuild -version
      - name: Build app and capture diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project 'Budgeting App.xcodeproj' \
            -scheme 'Budgeting App' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/tim80-xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^|[[:space:]])error:' /tmp/tim80-xcodebuild.log > .github/tim80-build-diagnostics.txt || true
            git add .github/tim80-build-diagnostics.txt
            git commit -m 'ci: capture TIM-80 build errors' || true
            git push || true
          fi
          exit "$status"
