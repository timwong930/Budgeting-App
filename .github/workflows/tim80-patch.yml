name: Apply TIM-80 compile fixes

on:
  push:
    branches:
      - 'timothyhwo2000/tim-80-complete-multi-account-portfolio-isolation-and-all'
    paths:
      - '.github/workflows/tim80-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Fix PortfolioTransaction argument ordering
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('Budgeting App/MarginViews.swift')
          source = path.read_text()
          old = '''                                notes: notes.nilIfBlank,
                                fundingBankAccount: type == .contribution ? fundingBankAccount.nilIfBlank : nil,
                                portfolioAccountId: portfolioAccountId
'''
          new = '''                                notes: notes.nilIfBlank,
                                portfolioAccountId: portfolioAccountId,
                                fundingBankAccount: type == .contribution ? fundingBankAccount.nilIfBlank : nil
'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('Expected PortfolioTransaction argument block not found')
          path.write_text(source)
          PY
      - name: Validate source
        shell: bash
        run: |
          grep -n -A2 'notes: notes.nilIfBlank' 'Budgeting App/MarginViews.swift' | grep 'portfolioAccountId: portfolioAccountId'
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/MarginViews.swift'
          if ! git diff --cached --quiet; then
            git commit -m 'TIM-80: fix portfolio transaction argument order'
            git push
          fi
      - name: Xcode version
        run: xcodebuild -version
      - name: Build app and capture diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project 'Budgeting App.xcodeproj' \
            -scheme 'Budgeting App' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/tim80-xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^|[[:space:]])error:' /tmp/tim80-xcodebuild.log > .github/tim80-build-diagnostics.txt || true
            git add .github/tim80-build-diagnostics.txt
            git commit -m 'ci: capture TIM-80 build errors' || true
            git push || true
          fi
          exit "$status"
