name: TIM-112 bank cash categories diagnostic

on:
  push:
    branches:
      - timothyhwo2000/tim-112-add-local-cash-categoriesbuckets-inside-bank-accounts
    paths:
      - .github/workflows/tim-112-bank-cash-categories-validation.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-112-add-local-cash-categoriesbuckets-inside-bank-accounts

      - name: Apply guarded bank category UI patch
        run: python3 .github/scripts/tim112_bank_cash_categories_patch.py

      - name: Capture compiler diagnostics
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project "Budgeting App.xcodeproj" \
            -scheme "Budgeting App" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > /tmp/tim112-build.log 2>&1
          status=$?
          {
            echo "xcodebuild exit status: $status"
            echo "--- compiler diagnostics ---"
            grep -E "error:|warning:" /tmp/tim112-build.log | tail -120 || true
          } > TIM112_BUILD_ERRORS.txt
          exit 0

      - name: Commit diagnostic snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-112 capture bank cash category build diagnostics"
          git push origin HEAD:timothyhwo2000/tim-112-add-local-cash-categoriesbuckets-inside-bank-accounts
