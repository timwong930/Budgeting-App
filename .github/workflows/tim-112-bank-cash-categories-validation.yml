name: TIM-112 bank cash categories final validation

on:
  push:
    branches:
      - timothyhwo2000/tim-112-add-local-cash-categoriesbuckets-inside-bank-accounts
    paths:
      - .github/workflows/tim-112-bank-cash-categories-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-112-add-local-cash-categoriesbuckets-inside-bank-accounts

      - name: Fix captured Swift interpolation typo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('Budgeting App/BankCashCategories.swift')
          text = path.read_text()
          old = 'format: .currency(code: \\"USD\\")'
          if old not in text:
              raise SystemExit('expected escaped USD interpolation not found')
          path.write_text(text.replace(old, 'format: .currency(code: "USD")', 1))
          PY
          rm -f TIM112_BUILD_ERRORS.txt

      - name: Build Momo's Money
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "Budgeting App.xcodeproj" \
            -scheme "Budgeting App" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit validated product changes and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/tim-112-bank-cash-categories-validation.yml
          rm -f .github/scripts/tim112_bank_cash_categories_patch.py
          rm -f TIM112_BUILD_ERRORS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-112 validate local bank cash categories"
          git push origin HEAD:timothyhwo2000/tim-112-add-local-cash-categoriesbuckets-inside-bank-accounts
