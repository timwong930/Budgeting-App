name: TIM-112 bank cash categories diagnostic 2

on:
  push:
    branches:
      - timothyhwo2000/tim-112-add-local-cash-categoriesbuckets-inside-bank-accounts
    paths:
      - .github/workflows/tim-112-bank-cash-categories-validation.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timothyhwo2000/tim-112-add-local-cash-categoriesbuckets-inside-bank-accounts

      - name: Apply first compiler fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('Budgeting App/BankCashCategories.swift')
          text = path.read_text()
          old = 'format: .currency(code: \\"USD\\")'
          if old in text:
              text = text.replace(old, 'format: .currency(code: "USD")', 1)
          path.write_text(text)
          PY

      - name: Capture next compiler diagnostics
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project "Budgeting App.xcodeproj" \
            -scheme "Budgeting App" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > /tmp/tim112-build.log 2>&1
          status=$?
          {
            echo "xcodebuild exit status: $status"
            echo "--- compiler diagnostics ---"
            grep -E "error:|warning:" /tmp/tim112-build.log | tail -160 || true
          } > TIM112_BUILD_ERRORS2.txt
          exit 0

      - name: Commit diagnostic snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TIM-112 capture second build diagnostics"
          git push origin HEAD:timothyhwo2000/tim-112-add-local-cash-categoriesbuckets-inside-bank-accounts
