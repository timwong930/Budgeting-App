name: TIM-95 Current Period Button

on:
  push:
    branches:
      - feature/tim-95-calendar-redesign
    paths:
      - .github/workflows/tim95-current-period-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tim-95-calendar-redesign
      - name: Apply patch
        run: python3 scripts/tim95_current_period_button_patch.py
      - name: Validate markers
        run: |
          grep -q 'calendarCurrentPeriodButtonTitle' 'Budgeting App/ContentView.swift'
          grep -q 'resetCalendarToCurrentPeriod' 'Budgeting App/ContentView.swift'
          grep -q 'Sunday – Saturday' 'Budgeting App/ContentView.swift'
      - name: Commit app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Budgeting App/ContentView.swift'
          git diff --cached --quiet || git commit -m 'TIM-95: add today and this week navigation button'
          git push origin HEAD:feature/tim-95-calendar-redesign
